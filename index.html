<style>
:root{
  --cream:#FBF4E6; --paper:#FFFBF4; --yellow:#F3C75F; --yellow-soft:#FBEBC0;
  --terra:#B0532B; --terra-dark:#8A3E1E; --brown:#3A2417; --brown-2:#644433;
  --red:#953A2A; --green:#2D6A39; --green-bg:#E2F1DE; --orange:#8A4B0F; --orange-bg:#FCE7CC;
  --line:#E6D4B6; --top:#7A3B24;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--cream);color:var(--brown);
  font:18px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans","Helvetica Neue",Arial,sans-serif;
  overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:var(--terra-dark)}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;
  padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top));background:var(--top);color:#FFF4DE;
  box-shadow:0 2px 6px rgba(58,36,23,.18)}
.homebtn{flex:0 0 auto;min-height:48px;display:inline-flex;align-items:center;gap:6px;padding:0 14px;border-radius:12px;
  background:var(--yellow);color:var(--brown);font-weight:800;text-decoration:none;white-space:nowrap;font-size:17px}
.toptitle{flex:1;min-width:0;font-weight:700;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{max-width:720px;margin:0 auto;padding:14px 14px calc(120px + env(safe-area-inset-bottom));outline:none}
.bottomnav{position:fixed;bottom:0;left:0;right:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);
  background:var(--paper);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.bottomnav a{min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  text-decoration:none;color:var(--brown-2);font-size:13.5px;line-height:1.15;text-align:center;padding:6px 2px;font-weight:700}
.bottomnav a .ic{font-size:21px;line-height:1}
.bottomnav a.on{color:var(--terra-dark);background:var(--yellow-soft)}
.bottomnav a.quick{color:var(--red)}
h1{font-size:27px;line-height:1.25;margin:6px 0 10px;color:var(--red)}
h2{font-size:22px;line-height:1.3;margin:24px 0 10px}
h3{font-size:19px;line-height:1.3;margin:14px 0 8px}
p{margin:8px 0}
.muted{color:var(--brown-2)}
.small{font-size:16px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0;
  box-shadow:0 1px 2px rgba(58,36,23,.05)}
.card.hl{background:var(--yellow-soft);border-color:#EBCB79}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:10px 14px;border-radius:14px;
  border:2px solid var(--terra);background:#fff;color:var(--terra-dark);font:inherit;font-weight:700;cursor:pointer;
  text-decoration:none;text-align:center;line-height:1.25;-webkit-tap-highlight-color:transparent;touch-action:manipulation;
  max-width:100%;word-break:break-word}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--terra);color:#FFF8EC}
.btn.big{width:100%;min-height:62px;font-size:20px}
.btn.block{width:100%}
.btn.soft{border-color:#E2C57E;background:var(--yellow-soft);color:var(--brown)}
.btn.ghost{border-color:var(--line);background:var(--paper);color:var(--brown)}
.btn.on{background:var(--terra);color:#FFF8EC}
.btn.playing{box-shadow:0 0 0 4px var(--yellow)}
.btn[disabled]{opacity:.55;cursor:default}
.btn:focus-visible,.homebtn:focus-visible,.bottomnav a:focus-visible,select:focus-visible{outline:3px solid #1E5FA8;outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
.row>.btn{flex:1 1 140px}
.stack{display:grid;gap:10px;margin:10px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.grid2>.btn{min-height:76px;flex-direction:column;gap:4px;font-size:17px}
.grid2 .ic{font-size:26px}
.en{font-size:22px;font-weight:600;line-height:1.4;margin:2px 0 6px;overflow-wrap:anywhere}
.en.xl{font-size:27px}
.en b,.st b{color:var(--red);font-weight:800}
.vi{color:var(--brown-2);margin:4px 0}
.hint{background:#F6EEDD;border-radius:10px;padding:8px 10px;margin:8px 0;font-size:17px}
.lbl{font-weight:700;color:var(--brown-2)}
.tip{background:#FFF3D6;border-left:5px solid var(--yellow);border-radius:8px;padding:8px 10px;margin:8px 0;font-size:17px}
.chip{display:inline-block;border-radius:999px;padding:3px 12px;font-size:15px;font-weight:700;background:#F1E6D2;color:var(--brown-2);margin-top:6px}
.chip.comfortable{background:var(--green-bg);color:var(--green)}
.chip.practice{background:var(--orange-bg);color:var(--orange)}
.good{background:var(--green-bg);color:var(--green);border-radius:12px;padding:12px;margin:10px 0;font-weight:700}
.almost{background:var(--orange-bg);color:var(--orange);border-radius:12px;padding:12px;margin:10px 0;font-weight:700}
.info{background:#EFE6D6;border-radius:12px;padding:12px;margin:10px 0}
.w{border-radius:6px;padding:0 3px}
.w.ok{background:var(--green-bg);color:var(--green);font-weight:700}
.w.miss{background:var(--orange-bg);color:var(--orange);font-weight:700}
.opt{width:100%;justify-content:flex-start;text-align:left;border-color:var(--line);background:var(--paper);color:var(--brown);font-weight:600}
.opt.right{background:var(--green-bg);border-color:#8DBF8F;color:var(--green)}
.opt.other{background:var(--orange-bg);border-color:#E9B77F;color:var(--orange)}
.bubble{border-radius:18px;padding:14px;margin:10px 0}
.bubble.guest{background:#fff;border:2px solid var(--line);border-top-left-radius:4px}
.bubble.me{background:var(--yellow-soft);border:2px solid #E7CD8A;border-top-right-radius:4px}
.who{font-size:15px;font-weight:800;color:var(--brown-2);text-transform:none}
.dl{border-bottom:1px solid var(--line);padding:10px 0}
.dl:last-child{border-bottom:0}
.bar{height:16px;border-radius:999px;background:#EADBC0;overflow:hidden;margin:6px 0}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#E9B64A,#C9763F);border-radius:999px}
.stat{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.stat:last-child{border-bottom:0}
.stat b{font-size:20px}
.count{font-size:44px;font-weight:800;color:var(--red);line-height:1}
.hero{position:relative;overflow:hidden;background:linear-gradient(160deg,#8C4027,#6B3220);color:#FFF4DE;border:0}
.hero h1{color:#FFE7A8;margin-top:2px}
.hero .muted{color:#F5DFC3}
.lanterns{position:absolute;top:-6px;right:10px;display:flex;gap:10px;pointer-events:none}
.lantern{width:26px;height:34px;border-radius:50%/45%;background:radial-gradient(circle at 50% 40%,#FFD36B,#D9562E 70%);
  position:relative;box-shadow:0 0 14px rgba(255,200,90,.55)}
.lantern:before{content:"";position:absolute;left:50%;top:-14px;width:2px;height:14px;background:#E9C77B}
.lantern:after{content:"";position:absolute;left:50%;bottom:-9px;width:6px;height:9px;margin-left:-3px;background:#F3C75F;border-radius:0 0 3px 3px}
.lantern.l2{margin-top:12px;transform:scale(.8)}
.lantern.l3{margin-top:4px;transform:scale(.9)}
.hero .msg{font-size:19px;font-weight:600;margin-top:4px;max-width:78%}
.toast{position:fixed;left:12px;right:12px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:40;max-width:620px;margin:0 auto;
  background:var(--brown);color:#FFF4DE;border-radius:14px;padding:12px 14px;font-size:17px;box-shadow:0 6px 20px rgba(0,0,0,.25);
  display:none}
.toast.show{display:block}
.banner{max-width:720px;margin:10px auto 0;padding:0 14px}
.banner .info{margin:0}
.toggle{background:none;border:0;color:var(--terra-dark);font:inherit;font-weight:700;text-decoration:underline;min-height:48px;padding:0 4px;cursor:pointer}
.hidden{display:none !important}
.stepnum{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;
  background:var(--terra);color:#fff;font-weight:800;font-size:16px;margin-right:6px;flex:0 0 auto}
.steph{display:flex;align-items:center;font-weight:800;font-size:19px;margin:4px 0 8px}
.weekcard.now{border:3px solid var(--terra)}
ul.clean{padding-left:22px;margin:6px 0}
ul.clean li{margin:4px 0}
select{font:inherit;min-height:52px;width:100%;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--brown);padding:0 10px}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:38px;text-align:center;font-size:14px}
.dot i{display:block;width:30px;height:30px;margin:0 auto 2px;border-radius:50%;background:#EADBC0}
.dot i.on{background:var(--yellow);box-shadow:inset 0 0 0 3px #D9A93A}
audio{width:100%;margin:8px 0}
.unitnum{display:inline-block;background:var(--yellow);color:var(--brown);border-radius:10px;padding:2px 10px;font-weight:800;font-size:15px}
.done{color:var(--green);font-weight:800}
.quickcat{scroll-margin-top:80px}
.qbtn{width:100%;flex-direction:column;align-items:flex-start;text-align:left;min-height:72px;border-color:var(--line);background:#fff;color:var(--brown);padding:12px 14px}
.qbtn .en{font-size:24px;margin:0}
.qbtn .vi{font-size:18px;margin:2px 0 0}
.qbtn .play{font-size:15px;color:var(--terra-dark);font-weight:800}
@media (min-width:700px){ .grid2{grid-template-columns:repeat(3,1fr)} }
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}

</style>

<script>
/* ============================================================
   LESSON CONTENT — English with Mẹ Hằng
   How to add a phrase: P("English with **stress**", "Tiếng Việt", "cách ĐỌC", "Real-life variant", "Mẹo (optional)")
   ** marks the stressed syllable(s). CAPS in the pronunciation hint = stressed.
   ============================================================ */
function P(en, vi, pr, real, tip) { return { en: en, vi: vi, pr: pr, real: real, tip: tip || "" }; }
function D(who, en, vi) { return { who: who, en: en, vi: vi }; }
function S(guest, alt, vi, opts) { return { guest: guest, alt: alt, vi: vi, options: opts.map(function (o) { return { en: o[0], vi: o[1] }; }) }; }

const LESSONS = {
  unit1: {
    num: 1,
    title: "Đón khách ở sân bay",
    titleEn: "Airport Welcome & First Impressions",
    description: "Mẹ đón bà Telma Garcia và gia đình tại Sân bay Quốc tế Đà Nẵng: chào hỏi, hỏi thăm chuyến bay, giúp mang hành lý.",
    phrases: [
      P("**Wel**come to Viet**nam**!", "Chào mừng mọi người đến Việt Nam!", "UEL-cơm tơ vi-et-NAM", "Welcome! You made it to Vietnam!", "Cuối chữ welcome là âm “m”: Mẹ ngậm môi lại nhẹ nhàng."),
      P("**Hi**, I'm **Hằng**. It's so **nice** to **meet** you!", "Xin chào, tôi là Hằng. Rất vui được gặp bạn!", "HAI, am HANG. its sâu NAIS tơ MÍT-chiu", "Hi there! I'm Hằng. So nice to finally meet you!", "“meet you” khi nói nhanh nghe như “mít-chiu”."),
      P("How was your **flight**?", "Chuyến bay của bạn thế nào?", "hao uơz dio PHLAIT", "So, how was the flight?", "Nhớ âm cuối “t” trong flight: đầu lưỡi chạm nướu răng trên rồi dừng lại."),
      P("You must be **tired** after such a **long** **jour**ney.", "Chắc bạn mệt lắm sau chuyến đi dài như vậy.", "diu mấst bi TAI-ơd ÉP-tơ sấch ơ LONG GIƠ-ni", "You guys must be exhausted!", "“You guys” là cách người Mỹ gọi thân mật “mọi người”, dùng cho cả nam và nữ."),
      P("Did you have any **trou**ble **find**ing your **lug**gage?", "Bạn tìm hành lý có gặp khó khăn gì không?", "đít-chu hev E-ni TRẤ-bồ PHAIN-đing dio LẤ-gịch", "Did you get all your bags okay?"),
      P("Let me **help** you with your **bags**.", "Để tôi giúp bạn mang hành lý nhé.", "lét-mi HEL-piu uýth dio BEGZ", "Here, let me grab those for you.", "bags kết thúc bằng âm “gz” rung nhẹ, khác với back (lưng)."),
      P("We're **so** **hap**py you're **here**!", "Chúng tôi rất vui vì mọi người đã đến!", "uia SÂU HE-pi dio HIA", "We're so glad you're here!"),
      P("The **car** is **wait**ing out**side**.", "Xe đang đợi ở bên ngoài.", "đơ CAR ỉz UÊI-đing ao-SAID", "Our car's just outside.", "Âm cuối “d” trong outside: chạm đầu lưỡi lên nướu, đừng bỏ mất."),
      P("**First**, we'll **go** to the ho**tel** to **rest**.", "Trước tiên, mình sẽ về khách sạn nghỉ ngơi.", "PHƠST, uiu GÂU tơ đơ hâu-TEL tơ REST", "We'll head to the hotel first so you can rest.", "hotel nhấn âm sau: hâu-TEL."),
      P("Is this your **first** **time** in Viet**nam**?", "Đây có phải lần đầu bạn đến Việt Nam không?", "ỉz đis dio PHƠST TAIM in vi-et-NAM", "Have you been to Vietnam before?")
    ],
    dialogue: [
      D("H", "Welcome to Vietnam! You must be Mrs. Garcia.", "Chào mừng đến Việt Nam! Chắc hẳn đây là bà Garcia?"),
      D("G", "Yes! And you must be Hằng. It's so wonderful to finally meet you!", "Đúng rồi! Còn chị chắc là Hằng. Thật tuyệt khi cuối cùng cũng được gặp chị!"),
      D("H", "It's so nice to meet you too! How was your flight?", "Tôi cũng rất vui được gặp chị! Chuyến bay của chị thế nào?"),
      D("G", "It was long, but it was okay. We're a little tired.", "Chuyến bay dài, nhưng cũng ổn. Chúng tôi hơi mệt một chút."),
      D("H", "You must be tired after such a long journey. Let me help you with your bags.", "Chắc mọi người mệt lắm sau chuyến đi dài như vậy. Để tôi giúp mang hành lý nhé."),
      D("G", "Oh, thank you! That's very kind of you.", "Ôi, cảm ơn chị! Chị thật chu đáo."),
      D("H", "The car is waiting outside. First, we'll go to the hotel to rest.", "Xe đang đợi bên ngoài. Trước tiên, mình sẽ về khách sạn nghỉ ngơi."),
      D("G", "That sounds perfect.", "Vậy thì tuyệt quá.")
    ],
    roleplay: {
      intro: "Mẹ đang đứng ở cửa ra Sân bay Đà Nẵng. Gia đình bà Telma vừa bước ra.",
      steps: [
        S("Hi! You must be Hằng!", "Hello! Are you Hằng?", "Xin chào! Chị chắc là Hằng!", [["Yes! Welcome to Vietnam!", "Đúng rồi! Chào mừng đến Việt Nam!"], ["Hi! It's so nice to meet you!", "Xin chào! Rất vui được gặp chị!"], ["Yes, I'm Hằng. We're so happy you're here!", "Vâng, tôi là Hằng. Chúng tôi rất vui vì mọi người đã đến!"]]),
        S("It's so nice to meet you. That was a really long flight!", "Wow, that flight felt like forever!", "Rất vui được gặp chị. Chuyến bay dài thật đấy!", [["You must be tired after such a long journey.", "Chắc chị mệt lắm sau chuyến đi dài như vậy."], ["Oh no! How was your flight?", "Ôi! Chuyến bay thế nào?"], ["Let's go to the hotel so you can rest.", "Mình về khách sạn để chị nghỉ ngơi nhé."]]),
        S("We have a lot of bags, I'm afraid.", "Sorry, we packed way too much!", "Chúng tôi mang nhiều hành lý quá.", [["No problem. Let me help you with your bags.", "Không sao. Để tôi giúp mang hành lý nhé."], ["Don't worry. The car is waiting outside.", "Đừng lo. Xe đang đợi bên ngoài."]])
      ],
      end: { en: "Thank you so much. You're very kind!", vi: "Cảm ơn chị nhiều lắm. Chị thật tốt bụng!" }
    }
  },

  unit2: {
    num: 2,
    title: "Giới thiệu gia đình & trò chuyện lịch sự",
    titleEn: "Introducing the Family & Polite Conversation",
    description: "Mẹ giới thiệu bản thân và gia đình, hỏi thăm cuộc sống của gia đình bà Telma ở Mỹ, và trò chuyện thân thiện.",
    phrases: [
      P("This is my **hus**band.", "Đây là chồng tôi.", "đis ỉz mai HẤZ-bần", "Let me introduce my husband.", "husband: âm cuối “d” rất nhẹ, nhưng đừng bỏ hẳn."),
      P("And this is my **daugh**ter, **Linh**.", "Và đây là con gái tôi, Linh.", "en đis ỉz mai ĐA-đơr, LINH", "And of course, you already know Linh!", "Người Mỹ đọc daughter gần như “ĐA-đơr”, âm “t” biến thành âm “đ” nhẹ."),
      P("**Please** call me **Hằng**.", "Cứ gọi tôi là Hằng nhé.", "PLIZ col mi HANG", "Oh, just call me Hằng.", "please kết thúc bằng âm “z” rung nhẹ."),
      P("What would you **like** me to **call** you?", "Tôi nên gọi bạn thế nào cho phải?", "guát gút-chu LAIK mi tơ COL diu", "Should I call you Telma or Mrs. Garcia?", "Đây là cách lịch sự nhất khi chưa biết nên gọi khách lớn tuổi thế nào. Lúc đầu Mẹ gọi “Mrs. Garcia”. Nếu bà nói “Call me Telma”, Mẹ cứ gọi “Telma” nhé."),
      P("It's **such** a **pleas**ure to **meet** your **fam**ily.", "Thật vui khi được gặp gia đình bạn.", "its SẤCH ơ PLE-giơ tơ MIT dio PHE-mơ-li", "We're so happy to finally meet all of you."),
      P("Your **fam**ily is **love**ly.", "Gia đình bạn thật dễ thương.", "dio PHE-mơ-li ỉz LẤV-li", "You have such a lovely family.", "lovely: âm “v” cắn nhẹ môi dưới, không đọc thành “b”."),
      P("Where do you **live** in the U**ni**ted **States**?", "Bạn sống ở đâu bên Mỹ?", "que đu diu LIV in đơ diu-NAI-địt STÊITS", "So where are you guys from in the States?", "“the States” là cách người Mỹ gọi nước Mỹ."),
      P("What do you **like** to **do** in your **free** time?", "Lúc rảnh bạn thích làm gì?", "guát đu diu LAIK tơ ĐU in dio PHRI taim", "What do you like to do for fun?"),
      P("We've **heard** so many **won**derful **things** about you.", "Chúng tôi đã nghe rất nhiều điều tốt đẹp về bạn.", "uiv HƠĐ sâu me-ni UẤN-đơ-phồ THINGZ ơ-BAO-chiu", "Linh has told us so much about you!", "things: đặt đầu lưỡi giữa hai hàm răng rồi thổi hơi nhẹ để ra âm “th”."),
      P("My **Eng**lish isn't **per**fect, but I'm **learn**ing!", "Tiếng Anh của tôi chưa hoàn hảo, nhưng tôi đang học!", "mai ING-glish ỈZ-ần PƠ-phịct, bất am LƠ-ning", "I'm still learning English, so please be patient with me.", "Câu này giúp Mẹ thoải mái hơn. Người nghe sẽ nói chậm lại và kiên nhẫn với Mẹ."),
      P("We **feel** so **luck**y to **have** you here.", "Chúng tôi thấy thật may mắn khi có bạn ở đây.", "ui PHIL sâu LẤ-ki tơ HEV diu hia", "We're so lucky you came all this way.")
    ],
    dialogue: [
      D("H", "Mrs. Garcia, this is my husband.", "Thưa bà Garcia, đây là chồng tôi."),
      D("G", "Nice to meet you! Please, call me Telma.", "Rất vui được gặp anh! Cứ gọi tôi là Telma nhé."),
      D("H", "Thank you, Telma. Please call me Hằng. And this is my daughter, Linh.", "Cảm ơn chị Telma. Chị cứ gọi tôi là Hằng. Và đây là con gái tôi, Linh."),
      D("G", "Oh, of course we know Linh! We've heard so many wonderful things about your family.", "Ồ, tất nhiên chúng tôi biết Linh rồi! Chúng tôi đã nghe rất nhiều điều tốt đẹp về gia đình chị."),
      D("H", "Thank you! Where do you live in the United States?", "Cảm ơn chị! Chị sống ở đâu bên Mỹ?"),
      D("G", "We live in a small town. It's quiet, but we love it.", "Chúng tôi sống ở một thị trấn nhỏ. Ở đó yên tĩnh, nhưng chúng tôi rất thích."),
      D("H", "That sounds lovely. My English isn't perfect, but I'm learning!", "Nghe thật dễ chịu. Tiếng Anh của tôi chưa hoàn hảo, nhưng tôi đang học!"),
      D("G", "Your English is great! Don't worry at all.", "Tiếng Anh của chị tốt mà! Đừng lo gì cả."),
      D("H", "You're very kind. We feel so lucky to have you here.", "Chị thật tốt bụng. Chúng tôi thấy thật may mắn khi có mọi người ở đây.")
    ],
    roleplay: {
      intro: "Gia đình hai bên gặp nhau lần đầu tại nhà hàng. Mẹ giới thiệu gia đình mình.",
      steps: [
        S("Hằng, is this your husband?", "And who's this?", "Hằng, đây là chồng chị phải không?", [["Yes, this is my husband.", "Vâng, đây là chồng tôi."], ["Yes! Let me introduce my husband.", "Vâng! Để tôi giới thiệu chồng tôi."]]),
        S("Please, just call me Telma.", "Oh, you don't have to call me Mrs. Garcia!", "Chị cứ gọi tôi là Telma thôi.", [["Thank you, Telma. Please call me Hằng.", "Cảm ơn chị Telma. Chị cứ gọi tôi là Hằng nhé."], ["Okay, Telma! It's such a pleasure to meet your family.", "Vâng, chị Telma! Thật vui khi được gặp gia đình chị."]]),
        S("So, what do you like to do in your free time?", "What do you do for fun?", "Vậy lúc rảnh chị thích làm gì?", [["I like cooking and gardening. How about you?", "Tôi thích nấu ăn và làm vườn. Còn chị thì sao?"], ["I love spending time with my family.", "Tôi thích dành thời gian cho gia đình."], ["What do you like to do in your free time?", "Lúc rảnh chị thích làm gì?"]])
      ],
      end: { en: "I can tell we're going to have a great time together!", vi: "Tôi biết chắc là chúng ta sẽ có khoảng thời gian thật vui bên nhau!" }
    }
  },

  unit3: {
    num: 3,
    title: "Nhận phòng khách sạn",
    titleEn: "Hotel or Villa Check-in",
    description: "Mẹ giúp khách ổn định chỗ ở: phòng, mật khẩu Wi-Fi, giờ ăn sáng, phòng tắm, máy lạnh và hỏi xem mọi thứ có thoải mái không.",
    phrases: [
      P("This is your **room**.", "Đây là phòng của bạn.", "đis ỉz dio RUM", "And here's your room!", "Âm “r” của Mỹ: cong lưỡi về sau, không rung lưỡi."),
      P("The **Wi**-Fi **pass**word is on this **card**.", "Mật khẩu Wi-Fi ở trên tấm thẻ này.", "đơ UAI-phai PES-uơd ỉz on đis CARD", "Here's the Wi-Fi password, it's on the card."),
      P("**Break**fast is **served** from **sev**en to **ten**.", "Bữa sáng phục vụ từ 7 giờ đến 10 giờ.", "BRÉC-phơst ỉz SƠVD phrâm SE-vần tơ TEN", "They serve breakfast from seven to ten.", "Đây là câu mẫu. Mẹ hỏi khách sạn giờ ăn sáng thật rồi đổi số cho đúng nhé."),
      P("The **bath**room is **o**ver **there**.", "Phòng tắm ở đằng kia.", "đơ BÉTH-rum ỉz ÂU-vơ ĐE", "The bathroom's right over there.", "bathroom có âm “th”: đầu lưỡi đặt nhẹ giữa hai hàm răng."),
      P("Here's the re**mote** for the **air** con**di**tioning.", "Đây là điều khiển máy lạnh.", "HIAZ đơ ri-MÂUT pho đi E cần-ĐI-shơ-ning", "Here's the AC remote.", "Người Mỹ hay nói tắt máy lạnh là “A.C.” (ây-xi)."),
      P("Is the **tem**perature o**kay** for you?", "Nhiệt độ phòng như vậy có ổn không?", "ỉz đơ TEM-prơ-chơ âu-KÊI pho diu", "Is it too cold in here?"),
      P("Is **ev**erything **com**fortable?", "Mọi thứ có thoải mái không?", "ỉz EV-ri-thing CẤMF-tơ-bồ", "Are you all settled in?", "comfortable người Mỹ đọc gọn 3 âm: CẤMF-tơ-bồ."),
      P("Would you like **ex**tra **tow**els or **pil**lows?", "Bạn có cần thêm khăn tắm hay gối không?", "gút-chu laik ÉCH-strơ TAO-ơlz o PI-lâuz", "Need any more towels?"),
      P("If you **need** anything, just **call** me.", "Nếu cần gì, cứ gọi cho tôi nhé.", "if diu NID e-ni-thing, giất COL mi", "Just give me a call if you need anything."),
      P("Let me **ask** the **front** **desk**.", "Để tôi hỏi lễ tân nhé.", "lét-mi ESK đơ PHRẤNT DESK", "I'll check with the front desk.", "desk kết thúc bằng hai âm “s-k”. Mẹ nói chậm: “đes-k”.")
    ],
    dialogue: [
      D("H", "This is your room. Is everything comfortable?", "Đây là phòng của chị. Mọi thứ có thoải mái không?"),
      D("G", "Oh, it's beautiful! Is there Wi-Fi?", "Ôi, đẹp quá! Ở đây có Wi-Fi không?"),
      D("H", "Yes. The Wi-Fi password is on this card.", "Có. Mật khẩu Wi-Fi ở trên tấm thẻ này."),
      D("G", "Perfect. What time is breakfast?", "Tuyệt quá. Mấy giờ ăn sáng vậy?"),
      D("H", "Breakfast is served from seven to ten.", "Bữa sáng phục vụ từ 7 giờ đến 10 giờ."),
      D("G", "Great. It's a little warm in here.", "Tốt quá. Trong phòng hơi nóng một chút."),
      D("H", "Here's the remote for the air conditioning.", "Đây là điều khiển máy lạnh."),
      D("G", "Thank you so much.", "Cảm ơn chị nhiều."),
      D("H", "If you need anything, just call me.", "Nếu cần gì, chị cứ gọi cho tôi nhé.")
    ],
    roleplay: {
      intro: "Mẹ vừa đưa gia đình bà Telma lên phòng khách sạn.",
      steps: [
        S("What time is breakfast tomorrow?", "When do they serve breakfast?", "Sáng mai mấy giờ ăn sáng?", [["Breakfast is served from seven to ten.", "Bữa sáng phục vụ từ 7 giờ đến 10 giờ."], ["Let me ask the front desk.", "Để tôi hỏi lễ tân nhé."]]),
        S("Do you know the Wi-Fi password?", "How do I get on the Wi-Fi?", "Chị có biết mật khẩu Wi-Fi không?", [["The Wi-Fi password is on this card.", "Mật khẩu Wi-Fi ở trên tấm thẻ này."], ["Just a moment, please. Let me check.", "Chờ tôi một chút. Để tôi kiểm tra."]]),
        S("It's a bit hot in the room.", "The room feels kind of warm.", "Trong phòng hơi nóng.", [["Here's the remote for the air conditioning.", "Đây là điều khiển máy lạnh."], ["Would you like me to ask the front desk for help?", "Chị có muốn tôi nhờ lễ tân giúp không?"]])
      ],
      end: { en: "Thanks, Hằng. Everything is perfect.", vi: "Cảm ơn Hằng. Mọi thứ đều tuyệt vời." }
    }
  },

  unit4: {
    num: 4,
    title: "Món ăn Việt & nhà hàng",
    titleEn: "Vietnamese Food & Restaurants",
    description: "Mẹ giới thiệu Mì Quảng, Cao lầu, Bánh mì, Phở, Bánh xèo, Cà phê sữa đá; hỏi về độ cay và dị ứng. Khi khách bị dị ứng, Mẹ luôn hỏi lại nhà hàng, không tự đoán.",
    phrases: [
      P("Would you like to **try** some **lo**cal **food**?", "Bạn có muốn thử món ăn địa phương không?", "gút-chu laik tơ TRAI sấm LÂU-cồ PHUD", "Wanna try some local food?", "“Wanna” là cách nói nhanh của “want to”."),
      P("This is a tra**di**tional **dish** from **Cen**tral Viet**nam**.", "Đây là món truyền thống của miền Trung Việt Nam.", "đis ỉz ơ trơ-ĐI-shơ-nồ ĐISH phrâm SEN-trồ vi-et-NAM", "This dish is from right here in Central Vietnam."),
      P("It's **made** with **rice** **noo**dles and **fresh** **herbs**.", "Món này làm từ sợi bánh gạo và rau thơm tươi.", "its MÊID uýth RAIS NU-đồz en PHRESH ƠBZ", "It's got rice noodles and lots of fresh herbs.", "Người Mỹ đọc herbs là “ơbz”, không đọc âm “h”."),
      P("**Mì Quảng** has **yel**low **noo**dles, **shrimp**, **pork**, and **pea**nuts.", "Mì Quảng có sợi mì vàng, tôm, thịt heo và đậu phộng.", "mì quảng hez DE-lâu NU-đồz, SHRIMP, POK, en PI-nấts", "Mì Quảng has just a little broth, so it's not really a soup.", "Mì Quảng có đậu phộng. Nếu khách dị ứng đậu phộng, Mẹ nhớ dặn nhà hàng."),
      P("**Cao lầu** is a **spe**cial **noo**dle dish from Hội **An**.", "Cao lầu là món mì đặc biệt của Hội An.", "cao lầu ỉz ơ SPE-shồ NU-đồ dish phrâm hội AN", "You can really only find real cao lầu in Hội An."),
      P("**Bánh mì** is a Vietnam**ese** **sand**wich.", "Bánh mì là bánh mì kẹp kiểu Việt Nam.", "banh mi ỉz ơ vi-et-nơ-MIZ SEN-uých", "Bánh mì is basically a Vietnamese sandwich, and the ones in Hội An are famous."),
      P("**Bánh xèo** is a **cris**py **rice** **pan**cake.", "Bánh xèo là bánh gạo chiên giòn.", "banh xèo ỉz ơ CRÍS-pi RAIS PEN-kêik", "You wrap it in rice paper and dip it in the sauce.", "Mẹ có thể chỉ khách: “Wrap it in rice paper and dip it in the sauce.” (Cuốn với bánh tráng rồi chấm nước chấm.)"),
      P("**Phở** is a **rice** **noo**dle **soup** with **beef** or **chick**en.", "Phở là món bánh phở nước, ăn với thịt bò hoặc thịt gà.", "phở ỉz ơ RAIS NU-đồ SUP uýth BIF o CHÍ-kần", "Pho is a beef or chicken noodle soup. It's really comforting.", "Nhiều người Mỹ đọc “phở” giống “phơ” hoặc “phâu”. Mẹ nghe vậy là họ đang nói về phở đấy."),
      P("**Cà phê sữa đá** is **iced** **cof**fee with con**densed** **milk**.", "Cà phê sữa đá là cà phê đá pha với sữa đặc.", "cà phê sữa đá ỉz AIST CO-phi uýth cần-ĐENST MILK", "It's really strong and sweet, and so refreshing."),
      P("Would you like it **spic**y or **mild**?", "Bạn muốn ăn cay hay ít cay?", "gút-chu LAIK it SPAI-si o MAILD", "Do you want it spicy, or not too spicy?", "mild kết thúc bằng “ld”: lưỡi chạm nướu rồi dừng."),
      P("Is it **too** **spic**y?", "Có cay quá không?", "ỉz-it TU SPAI-si", "Too hot for you?", "Người Mỹ hay dùng “hot” với nghĩa “cay”."),
      P("Do you have any **food** **al**lergies?", "Bạn có bị dị ứng thực phẩm nào không?", "đu diu hev e-ni PHUD E-lơ-giz", "Is there anything you can't eat?", "Nếu khách bị dị ứng, Mẹ hỏi lại nhà hàng: “Does this dish have peanuts?” Đừng tự đoán món nào an toàn.")
    ],
    dialogue: [
      D("H", "Would you like to try some local food?", "Chị có muốn thử món ăn địa phương không?"),
      D("G", "Yes, I'd love to! What do you recommend?", "Có chứ, tôi rất muốn! Chị gợi ý món gì?"),
      D("H", "This is Mì Quảng. It's a traditional dish from Central Vietnam.", "Đây là Mì Quảng. Đây là món truyền thống của miền Trung Việt Nam."),
      D("G", "It looks delicious. What's in it?", "Trông ngon quá. Trong món này có gì?"),
      D("H", "It's made with rice noodles and fresh herbs. It has shrimp, pork, and peanuts.", "Món này làm từ sợi bánh gạo và rau thơm tươi. Có tôm, thịt heo và đậu phộng."),
      D("G", "Oh, I'm allergic to peanuts, actually.", "Ồ, thật ra tôi bị dị ứng đậu phộng."),
      D("H", "Thank you for telling me. Let me check with the restaurant and ask for no peanuts.", "Cảm ơn chị đã cho tôi biết. Để tôi hỏi lại nhà hàng và dặn không cho đậu phộng."),
      D("G", "Thank you. That's very kind.", "Cảm ơn chị. Chị thật chu đáo."),
      D("H", "Would you like it spicy or mild?", "Chị muốn ăn cay hay ít cay?"),
      D("G", "Mild, please.", "Ít cay thôi nhé."),
      D("H", "Do you like it?", "Chị thấy có ngon không?"),
      D("G", "I love it! It's delicious.", "Tôi thích lắm! Ngon tuyệt.")
    ],
    roleplay: {
      intro: "Buổi tối đầu tiên, gia đình bà Telma muốn ăn món địa phương.",
      steps: [
        S("Would you recommend a good local restaurant?", "Where should we eat tonight?", "Chị có thể gợi ý một nhà hàng địa phương ngon không?", [["Of course! I'd love to take you to one of my favorite restaurants.", "Tất nhiên rồi! Tôi rất muốn đưa chị đến một trong những nhà hàng tôi thích nhất."], ["There are many great local restaurants nearby.", "Gần đây có nhiều nhà hàng địa phương rất ngon."], ["What kind of food would you like to try?", "Chị muốn thử món gì?"]]),
        S("What's in this dish?", "What is this made of?", "Món này có những gì?", [["It's made with rice noodles and fresh herbs.", "Món này làm từ sợi bánh gạo và rau thơm tươi."], ["Let me ask the restaurant.", "Để tôi hỏi nhà hàng nhé."]]),
        S("I can't eat peanuts. I have an allergy.", "Just so you know, I'm allergic to peanuts.", "Tôi không ăn được đậu phộng. Tôi bị dị ứng.", [["Thank you for telling me. Let me check with the restaurant.", "Cảm ơn chị đã cho tôi biết. Để tôi hỏi lại nhà hàng."], ["No problem. We will ask them to make it without peanuts.", "Không sao. Mình sẽ nhờ họ làm món không có đậu phộng."]]),
        S("Wow, this is a little spicy!", "Whoa, that's hot!", "Ôi, món này hơi cay!", [["Is it too spicy? Would you like some water?", "Có cay quá không? Chị có muốn uống nước không?"], ["Sorry! Next time we'll order it mild.", "Xin lỗi chị! Lần sau mình gọi ít cay nhé."]])
      ],
      end: { en: "This is delicious. Thank you for bringing us here!", vi: "Ngon quá. Cảm ơn chị đã đưa chúng tôi đến đây!" }
    }
  },

  unit5: {
    num: 5,
    title: "Khám phá phố cổ Hội An",
    titleEn: "Exploring Hội An Ancient Town",
    description: "Mẹ giới thiệu phố cổ, Chùa Cầu, đèn lồng, tiệm may, sông Thu Bồn, đi thuyền và thả hoa đăng; đề nghị chụp ảnh và giải thích giá.",
    phrases: [
      P("**This** is Hội **An** **An**cient **Town**.", "Đây là phố cổ Hội An.", "đis ỉz hội AN ÊIN-shần TAON", "Welcome to the Old Town!", "ancient đọc là “ÊIN-shần”."),
      P("It was an im**por**tant **trad**ing **port** for **hun**dreds of **years**.", "Nơi đây từng là thương cảng quan trọng suốt hàng trăm năm.", "it uơz ơn im-PO-tần TRÊI-đing POT pho HẤN-đrịdz ơv DIAZ", "Back in the day, ships came here from all over Asia and Europe."),
      P("**Trad**ers came from Ja**pan**, **Chi**na, and **Eu**rope.", "Thương nhân đến từ Nhật Bản, Trung Quốc và châu Âu.", "TRÊI-đơz kêim phrâm giơ-PEN, CHAI-nơ, en DIU-rợp", "That's why you see Japanese, Chinese, and Vietnamese styles here."),
      P("The **old** **town** is a U**NES**CO **World** **Her**itage **Site**.", "Phố cổ là Di sản Văn hóa Thế giới được UNESCO công nhận.", "đi ÂULD TAON ỉz ơ diu-NES-câu UƠLD HE-ri-tịch SAIT", "It's been a World Heritage Site since 1999."),
      P("This is the Japa**nese** **Cov**ered **Bridge**.", "Đây là Chùa Cầu, cây cầu có mái che của người Nhật.", "đis ỉz đơ gie-pơ-NIZ CẤ-vơd BRIDG", "It's over four hundred years old, and it's on our money!", "Chùa Cầu được in trên tờ tiền 20.000 đồng. Khách sẽ rất thích chi tiết này."),
      P("The **lan**terns are **beau**tiful at **night**.", "Đèn lồng buổi tối đẹp lắm.", "đơ LEN-tơnz a BIU-đơ-phồ ét NAIT", "Wait till you see the lanterns light up tonight."),
      P("Would you like to take a **boat** **ride** on the **Thu Bồn** **Riv**er?", "Bạn có muốn đi thuyền trên sông Thu Bồn không?", "gút-chu laik tơ têik ơ BÂUT RAID on đơ thu bồn RI-vơ", "Wanna hop on a boat?"),
      P("You can **make** a **wish** and re**lease** a **flow**er **lan**tern.", "Bạn có thể ước một điều và thả hoa đăng.", "diu cần MÊIK ơ UÍSH en ri-LIS ơ PHLAO-ơ LEN-tơn", "People float a little candle lantern on the river and make a wish."),
      P("The **tai**lor **shops** can **make** **clothes** for you in a **day** or **two**.", "Các tiệm may ở đây có thể may đồ cho bạn trong một hai ngày.", "đơ TÊI-lơ SHOPS cần MÊIK CLÂUĐZ pho diu in ơ ĐÊI o TU", "You can get a dress made here really fast.", "clothes khó đọc. Mẹ có thể đọc gần như “clâuz” cũng được, người Mỹ vẫn hiểu."),
      P("Would you like me to **take** a **pho**to of you?", "Bạn có muốn tôi chụp ảnh cho bạn không?", "gút-chu LAIK mi tơ TÊIK ơ PHÂU-đâu ơv diu", "Want me to take your picture?"),

    phrases: [
      P("**Tết** is the Vietnam**ese** **Lu**nar **New** **Year**.", "Tết là Tết Nguyên đán, năm mới âm lịch của người Việt.", "tết ỉz đơ vi-et-nơ-MIZ LU-nơ NIU DIA", "Tết is the biggest holiday of the year for us."),
      P("This **year**, **Tết** is on **Feb**ruary **sixth**.", "Năm nay, Tết rơi vào ngày 6 tháng 2.", "đis DIA, tết ỉz on PHÉP-ru-e-ri SIKSTH", "The New Year starts right after you leave!", "sixth rất khó, người bản xứ cũng nói nhanh. Mẹ nói chậm “siks-th” là đủ."),
      P("Before **Tết**, **fam**ilies **clean** and **dec**orate their **homes**.", "Trước Tết, các gia đình dọn dẹp và trang trí nhà cửa.", "bi-PHO tết, PHE-mơ-liz CLIN en ĐE-cơ-rêit đe HÂUMZ", "Everyone's busy cleaning and getting ready right now."),
      P("We **clean** to say good**bye** to the **old** **year** and **wel**come **good** **luck**.", "Chúng tôi dọn dẹp để tiễn năm cũ và đón may mắn.", "ui CLIN tơ sêi gút-BAI tơ đi ÂULD DIA en UEL-cơm GÚD LẤCK", "It's like a fresh start for the new year."),
      P("**Bánh chưng** and **bánh tét** are **stick**y **rice** **cakes**.", "Bánh chưng và bánh tét là bánh làm từ gạo nếp.", "bánh chưng en bánh tét a STÍ-ki RAIS KÊIKS", "They're wrapped in leaves, with pork and mung beans inside.", "Mẹ có thể nói thêm: “Bánh chưng is square, and bánh tét is long and round.” (Bánh chưng hình vuông, bánh tét hình trụ dài.)"),

      P("This is a **five**-**fruit** **tray**. It's for our **an**cestors.", "Đây là mâm ngũ quả, dùng để dâng lên tổ tiên.", "đis ỉz ơ PHAIV-PHRUT TRÊI. its pho ao EN-ses-tơz", "Each fruit has a special meaning, like a wish for the new year.", "Mỗi vùng chọn loại quả khác nhau. Mẹ có thể nói: “It's different in every region.”"),
      P("We **us**ually **spend** **Tết** with our **fam**ily.", "Chúng tôi thường đón Tết cùng gia đình.", "ui DIU-giu-ơ-li SPEND tết uýth ao PHE-mơ-li", "It's all about family. Everyone goes home for Tết."),
      P("In **man**y **homes**, we **take** off our **shoes** at the **door**.", "Ở nhiều nhà, mọi người cởi giày ở cửa.", "in ME-ni HÂUMZ, ui TÊIK of ao SHUZ ét đơ ĐO", "Just follow what the family does, and you'll be fine.", "Đây là cách cư xử lịch sự khi khách đến thăm nhà người Việt. Mẹ có thể nhắc nhẹ nhàng, không cần bắt buộc."),

      D("H", "Tết is coming! Tết is the Vietnamese Lunar New Year. This year, it's on February sixth.", "Sắp Tết rồi! Tết là năm mới âm lịch của người Việt. Năm nay Tết rơi vào ngày 6 tháng 2."),
      D("G", "Oh, right after we leave! What do people do?", "Ồ, ngay sau khi chúng tôi về! Mọi người làm gì vào dịp này?"),
      D("H", "Before Tết, families clean and decorate their homes. Many families use yellow apricot flowers and red decorations for good luck.", "Trước Tết, các gia đình dọn dẹp và trang trí nhà cửa. Nhiều nhà dùng hoa mai vàng và đồ trang trí màu đỏ để cầu may mắn."),
      D("G", "What do you eat for Tết?", "Ngày Tết mọi người ăn gì?"),
      D("H", "We eat bánh chưng and bánh tét. They are sticky rice cakes with pork and mung beans inside.", "Chúng tôi ăn bánh chưng và bánh tét. Đó là bánh gạo nếp, bên trong có thịt heo và đậu xanh."),
      D("G", "And what is that tray of fruit?", "Còn mâm trái cây kia là gì vậy?"),
      D("H", "This is a five-fruit tray. It's for our ancestors.", "Đây là mâm ngũ quả, dùng để dâng lên tổ tiên."),
      D("G", "That's beautiful. Do you give gifts?", "Đẹp quá. Mọi người có tặng quà không?"),
      D("H", "Giving lucky money is a way to wish someone good luck. But customs are different in every family and region.", "Lì xì là cách để chúc ai đó may mắn. Nhưng phong tục mỗi gia đình, mỗi vùng miền mỗi khác."),
      D("G", "I love that. Happy Lunar New Year!", "Tôi thích điều đó. Chúc mừng năm mới!"),
      D("H", "Happy Lunar New Year! Wishing you health, happiness, and good fortune.", "Chúc mừng năm mới! Chúc chị sức khỏe, hạnh phúc và may mắn.")
    ],
    roleplay: {
      intro: "Đường phố đang trang trí đón Tết. Gia đình bà Telma rất tò mò.",
      steps: [
        S("What exactly is Tết?", "So what's this Tết holiday everyone's talking about?", "Tết chính xác là gì vậy?", [["Tết is the Vietnamese Lunar New Year.", "Tết là năm mới âm lịch của người Việt."], ["It's our biggest holiday. We usually spend Tết with our family.", "Đó là ngày lễ lớn nhất của chúng tôi. Chúng tôi thường đón Tết cùng gia đình."]]),
        S("Why is everyone cleaning their houses?", "Why's everybody so busy cleaning?", "Sao ai cũng dọn dẹp nhà cửa vậy?", [["We clean to say goodbye to the old year and welcome good luck.", "Chúng tôi dọn dẹp để tiễn năm cũ và đón may mắn."], ["Before Tết, families clean and decorate their homes.", "Trước Tết, các gia đình dọn dẹp và trang trí nhà cửa."]]),
        S("What are those red envelopes for?", "What's in the little red envelopes?", "Những phong bao đỏ kia để làm gì?", [["Giving lucky money is a way to wish someone good luck.", "Lì xì là cách để chúc ai đó may mắn."], ["It's lucky money. We call it lì xì.", "Đó là tiền mừng tuổi. Chúng tôi gọi là lì xì."]]),
        S("Should I do anything special when we visit your relatives?", "Is there anything I should know before we visit your family?", "Khi đến thăm họ hàng nhà chị, tôi có cần lưu ý gì không?", [["In many homes, we take off our shoes at the door.", "Ở nhiều nhà, mọi người cởi giày ở cửa."], ["Just smile and say “Happy New Year.” They will love it!", "Chị chỉ cần mỉm cười và nói “Chúc mừng năm mới”. Mọi người sẽ rất thích!"]])
      ],
      end: { en: "Thank you for teaching us. I feel like part of the family!", vi: "Cảm ơn chị đã chỉ cho chúng tôi. Tôi thấy mình như người trong nhà vậy!" }
    }
  },

  unit9: {

    phrases: [
      P("We will **leave** at **eight** a.**m**.", "Mình sẽ đi lúc 8 giờ sáng.", "ui uiu LIV ét ÊIT ây-EM", "We're heading out at eight.", "leave (đi) có âm “i” dài; live (sống) có âm “i” ngắn."),

      P("The **driv**er will **pick** us **up** **here**.", "Tài xế sẽ đón mình ở đây.", "đơ ĐRAI-vơ uiu PI-kơ-SẤP HIA", "The driver's coming to pick us up right here.", "“pick us up” nói liền: “pi-kơ-sấp”."),
      P("The **traf**fic is a **lit**tle **heav**y.", "Đường hơi kẹt xe một chút.", "đơ TRE-phịk ỉz ơ LI-đồ HE-vi", "Traffic's kinda bad right now."),
      P("Please **wait** **here** for a **mo**ment.", "Mọi người đợi ở đây một chút nhé.", "pliz UÊIT HIA pho ơ MÂU-mần", "Can you guys hang on here for a sec?"),
      P("Would you like to **stop** somewhere a**long** the **way**?", "Bạn có muốn dừng lại ở đâu trên đường không?", "gút-chu laik tơ STOP sấm-que ơ-LONG đơ UÊI", "Want to stop anywhere on the way?"),
      P("**Sor**ry, there's a **change** of **plans**.", "Xin lỗi, kế hoạch có chút thay đổi.", "SO-ri, đez ơ CHÊINJ ơv PLENZ", "Heads up, we need to change the plan a little."),
      P("Is it o**kay** if we **go** to**mor**row in**stead**?", "Mình đổi sang đi vào ngày mai có được không?", "ỉz it âu-KÊI if ui GÂU tơ-MA-râu in-STED", "Would tomorrow work better?"),
      P("**Go** **straight**, then turn **left**.", "Đi thẳng, rồi rẽ trái.", "GÂU STRÊIT, đen tơn LEFT", "Keep going straight and make a left.", "left (trái) bắt đầu bằng “l”; right (phải) bắt đầu bằng “r”. Hai từ này rất quan trọng!")
    ],
    dialogue: [

      D("G", "Okay! How far is Hội An?", "Được! Hội An cách đây bao xa?"),
      D("H", "It takes about forty-five minutes to get there.", "Đến đó mất khoảng 45 phút."),
      D("G", "Should we meet at the front door?", "Mình có nên gặp nhau ở cửa trước không?"),
      D("H", "Let's meet in the hotel lobby. I'll book a Grab for us.", "Mình gặp nhau ở sảnh khách sạn nhé. Tôi sẽ đặt xe Grab cho mình."),
      D("G", "Perfect.", "Tuyệt."),
      D("H", "Sorry, the traffic is a little heavy. The driver will be here in five minutes.", "Xin lỗi, đường hơi kẹt xe. Năm phút nữa tài xế sẽ đến."),
      D("G", "No problem at all.", "Không sao đâu."),
      D("H", "Would you like to stop somewhere along the way?", "Chị có muốn dừng lại ở đâu trên đường không?"),
      D("G", "Maybe for coffee?", "Có lẽ ghé uống cà phê?"),
      D("H", "Great idea! I know a nice café.", "Ý hay quá! Tôi biết một quán cà phê rất xinh.")
    ],
    roleplay: {

      steps: [

        S("How long is the drive?", "Is it a long ride?", "Đi xe mất bao lâu?", [["It takes about twenty minutes to get there.", "Đến đó mất khoảng 20 phút."], ["Not long. About twenty minutes.", "Không lâu đâu. Khoảng 20 phút."]]),
        S("Where's our car? It's been a while.", "Is the driver coming soon?", "Xe của mình đâu rồi? Đợi lâu quá.", [["The traffic is a little heavy. Please wait here for a moment.", "Đường hơi kẹt xe. Mọi người đợi ở đây một chút nhé."], ["Let me check. Just a moment, please.", "Để tôi kiểm tra. Chờ một chút nhé."]]),
        S("Could we go to the beach today instead?", "Any chance we could go to the beach today?", "Hôm nay mình đổi sang đi biển được không?", [["Of course! Let me change the plans.", "Tất nhiên rồi! Để tôi đổi kế hoạch."], ["Let me check, and I'll tell you soon.", "Để tôi kiểm tra rồi báo chị ngay nhé."]])
      ],
      end: { en: "Thanks for taking care of everything, Hằng!", vi: "Cảm ơn Hằng đã lo chu đáo mọi thứ!" }
    }

  unit11: {
    num: 11,
    title: "Sự cố & tình huống khẩn cấp",
    titleEn: "Problems & Emergencies",
    description: "Câu ngắn, rõ ràng cho lúc cần: khách bị mệt, đau, mất đồ, tìm hiệu thuốc, đi bệnh viện, gọi cấp cứu (115) và gọi người nhà.",
    phrases: [

      P("Where does it **hurt**?", "Bạn đau ở đâu?", "que đơz it HƠT", "Where's the pain?"),
      P("Let's **find** a **phar**macy.", "Mình đi tìm hiệu thuốc nhé.", "lets PHAIND ơ PHAR-mơ-si", "There's a pharmacy just down the street."),
      P("I'll **help** you.", "Tôi sẽ giúp bạn.", "ail HEL-piu", "Don't worry, I've got you."),
      P("Can you **tell** me what **hap**pened?", "Bạn kể tôi nghe chuyện gì đã xảy ra được không?", "cần diu TEL mi guát HE-pần", "What happened?"),
      P("**Please** **stay** here while I get **help**.", "Bạn ở lại đây nhé, tôi đi tìm người giúp.", "PLIZ STÊI hia uail ai get HELP", "Stay right here. I'll be right back with help."),

      P("Let's **go** **back** and **look** for it.", "Mình quay lại tìm thử nhé.", "lets GÂU BEK en LÚK pho it", "Let's retrace our steps."),
      P("I'm **call**ing an **am**bulance **now**.", "Tôi đang gọi xe cấp cứu đây.", "am CO-ling ơn EM-biu-lần NAO", "I'm calling 115. That's the ambulance number here.", "Số khẩn cấp ở Việt Nam: 115 cấp cứu, 113 công an, 114 cứu hỏa."),
      P("I'll **call** your **fam**ily **right** a**way**.", "Tôi sẽ gọi cho gia đình bạn ngay.", "ail COL dio PHE-mơ-li RAIT ơ-UÊI", "Do you want me to call someone for you?"),
      P("**Breathe** **slow**ly. **Help** is **com**ing.", "Hít thở chậm thôi. Người giúp đang tới.", "BRIĐ SLÂU-li. HELP ỉz CẤ-ming", "Just breathe. Help is on the way.")
    ],
    dialogue: [
      D("H", "Are you feeling okay? You look pale.", "Chị thấy trong người ổn không? Trông chị xanh xao quá."),
      D("G", "I don't feel well. My stomach hurts.", "Tôi thấy không khỏe. Tôi bị đau bụng."),
      D("H", "I'm sorry. Where does it hurt?", "Tội chị quá. Chị đau ở đâu?"),
      D("G", "Right here. I think it was something I ate.", "Ngay chỗ này. Chắc là do món gì tôi ăn."),

      D("G", "I really appreciate it.", "Tôi thật sự cảm kích."),
      D("H", "Please stay here while I get some water.", "Chị ở lại đây nhé, tôi đi lấy nước.")
    ],
    roleplay: {
      intro: "Trong lúc đi chơi, có chuyện bất ngờ xảy ra. Mẹ bình tĩnh nhé, câu ngắn là đủ.",
      steps: [
        S("Hằng, I don't feel very well.", "I'm feeling kind of sick.", "Hằng ơi, tôi thấy không được khỏe lắm.", [["Are you feeling okay? Do you need a doctor?", "Chị thấy ổn không? Chị có cần bác sĩ không?"], ["I'm sorry. Can you tell me what happened?", "Tội chị quá. Chị kể tôi nghe chuyện gì đã xảy ra được không?"]]),
        S("I think I left my phone in the car!", "Oh no, my phone is gone!", "Hình như tôi để quên điện thoại trên xe rồi!", [["Don't worry. I'll help you. Let me contact the Grab driver.", "Đừng lo. Tôi sẽ giúp chị. Để tôi liên lạc với tài xế Grab."], ["Let's go back and look for it.", "Mình quay lại tìm thử nhé."]]),
        S("My head hurts a lot.", "I've got a really bad headache.", "Tôi đau đầu quá.", [["Let's find a pharmacy.", "Mình đi tìm hiệu thuốc nhé."], ["Please sit down. Do you need some water?", "Chị ngồi xuống đi. Chị có cần uống nước không?"]])
      ],
      end: { en: "Thank you, Hằng. I feel much better knowing you're here.", vi: "Cảm ơn Hằng. Có chị ở đây, tôi thấy yên tâm hơn nhiều." }
    }
  },

  unit12: {
    num: 12,
    title: "Chia tay & giữ liên lạc",

    description: "Cảm ơn khách, nói về những kỷ niệm đẹp, chúc thượng lộ bình an, hẹn giữ liên lạc và mời khách quay lại.",
    phrases: [

  }

  async function doShadow(id) {
    var p = PH[id], box = $("#shadow-msg"); if (!p || !box) return;
    TTS.stop(); var my = SEQ;
    var gap = Math.max(2200, plain(p.en).split(/\s+/).length * 650 + 1200);
    if (!TTS.ok) { box.innerHTML = '<div class="info">Máy chưa đọc được âm thanh. Mẹ nhìn câu và đọc to 3 lần nhé. Mẹ giỏi lắm!</div>'; markPracticed(id); return; }
    for (var i = 1; i <= 3; i++) {
      box.innerHTML = '<div class="info">Lượt ' + i + "/3: Mẹ lắng nghe…</div>";
      await TTS.speak(p.en, { rate: i === 3 ? 0.9 : rateFor("slow") });
      if (my !== SEQ) return;
      box.innerHTML = '<div class="good">Lượt ' + i + "/3: Bây giờ Mẹ nói theo nhé! 🗣️</div>";
      await wait(gap * (i === 3 ? 0.9 : 1.1));
      if (my !== SEQ) return;
    }
    box.innerHTML = '<div class="good">' + esc(pick(["Mẹ giỏi lắm! Mỗi ngày một chút nhé!", "Very good, Mẹ!", "Mẹ đang tiến bộ từng ngày!"])) + "</div>";
    markPracticed(id);
  }
  async function doSR(id, btn, onResult) {
    var target = PH[id] ? PH[id].en : id; var out = $("#sr-res");
    state.micExplained = true; save();
    TTS.stop(); stopRecognition();
    if (btn) { btn.disabled = true; btn.innerHTML = "👂 Đang nghe… Mẹ nói đi ạ"; }
    var r = await recognizeOnce();
    if (btn) { btn.disabled = false; btn.innerHTML = "🎙️ Bấm rồi nói lại"; }
    if (onResult) { onResult(r); return; }
    if (r.error) {
      out.innerHTML = '<div class="almost">' + esc(srErrorText(r.error)) + "</div>";
      if ((r.error === "not-allowed" || r.error === "service-not-allowed" || r.error === "network" || r.error === "init" || r.error === "start") && REC_OK) { var rb = $("#recbox"); if (rb) rb.classList.remove("hidden"); }
      return;
    }
    var res = analyze(target, r.alts);
    out.innerHTML = feedbackHtml(res, target) + '<div class="row">' + playBtn(target, "▶ Nghe lại giọng mẫu", "slow") + "</div>";
    if (PH[id]) markPracticed(id);

  function doRecord(id, btn) {
    var out = $("#rec-out");
    if (Recorder.active()) { Recorder.stop(); return; }
    state.micExplained = true; save(); TTS.stop();
    btn.innerHTML = "⏹️ Dừng ghi âm"; btn.classList.add("primary");
    out.innerHTML = '<div class="info">🔴 Đang ghi âm… Mẹ nói câu tiếng Anh, rồi bấm “Dừng ghi âm”.</div>';
    Recorder.start(function (url) {
      btn.innerHTML = "⏺️ Ghi âm lại"; btn.classList.remove("primary");
      if (!url) { out.innerHTML = '<div class="almost">Chưa ghi được âm thanh. Mẹ thử lại nhé.</div>'; return; }
      out.innerHTML = '<div class="good">Mẹ đã ghi âm xong! Bấm ▶ trên thanh bên dưới để nghe lại giọng mình.</div><audio controls src="' + url + '"></audio>' + selfCheck();
      if (PH[id]) markPracticed(id);

      btn.innerHTML = "⏺️ Ghi âm giọng Mẹ"; btn.classList.remove("primary");

      var l = u.dialogue[i];
      await TTS.speak(l.en, { rate: rateFor(mode), voice: l.who === "H" ? TTS.primary() : voiceOf("guest") });
      if (row) row.style.background = "";
      if (my !== SEQ) return;
      await wait(450);
    }
    markActivity();
  }
  var ACT = {
    play: function (el) {
      var r = REG[+el.getAttribute("data-r")]; if (!r) return;
      Array.prototype.forEach.call(document.querySelectorAll(".playing"), function (b) { b.classList.remove("playing"); });
      TTS.stop(); el.classList.add("playing");
      var voice = r.v ? (RP && r.v === RP.voice && RP.curVoice ? RP.curVoice : voiceOf(r.v)) : (LQ.q && el.closest("#lq") ? LQ.voice : TTS.primary());
      TTS.speak(r.t, { rate: rateFor(isNaN(+el.getAttribute("data-mode")) ? el.getAttribute("data-mode") : +el.getAttribute("data-mode")), voice: voice }).then(function () { el.classList.remove("playing"); });
    },
    stop: function () { TTS.stop(); Array.prototype.forEach.call(document.querySelectorAll(".dl"), function (r) { r.style.background = ""; }); },
    dialog: function (el) { playDialog(+el.getAttribute("data-n"), el.getAttribute("data-mode")); },
    speed: function (el) { state.speed = +el.getAttribute("data-v"); save(); refreshKeepState(); TTS.speak("This is the speed you chose.", { rate: state.speed }); },
    fav: function (el) {
      var id = el.getAttribute("data-id"), k = state.fav.indexOf(id);
      if (k >= 0) state.fav.splice(k, 1); else state.fav.push(id); save();
      var f = isFav(id); el.textContent = f ? "★ Đã lưu" : "☆ Lưu yêu thích";
      if (el.classList.contains("btn")) { el.classList.toggle("soft", f); el.classList.toggle("ghost", !f); }
      toast(f ? "Đã lưu vào Câu yêu thích ⭐" : "Đã bỏ khỏi Câu yêu thích");
    },
    rate: function (el) {
      var id = el.getAttribute("data-id"), v = el.getAttribute("data-v");
      setStatus(id, v); var rb = $("#ratebox"); if (rb) rb.outerHTML = rateBox(id);
      toast(v === "comfortable" ? "😊 Tuyệt vời! Mẹ đã quen câu này." : v === "practice" ? "💪 Đã thêm vào phần Ôn tập. Mình luyện thêm nhé!" : "🌱 Không sao, mình nghe thêm nhé!");
    },
    shadow: function (el) { doShadow(el.getAttribute("data-id")); },
    sr: function (el) { doSR(el.getAttribute("data-id"), el); },
    showrec: function (el) { var rb = $("#recbox"); if (rb) rb.classList.remove("hidden"); el.classList.add("hidden"); },
    rec: function (el) { doRecord(el.getAttribute("data-id"), el); },
    showreal: function (el) { var t = $("#realtxt"); if (t) t.classList.toggle("hidden"); el.textContent = t && t.classList.contains("hidden") ? "👀 Hiện câu" : "🙈 Ẩn câu"; },
    togglevi: function (el) { var box = document.getElementById(el.getAttribute("data-target")); if (box) Array.prototype.forEach.call(box.querySelectorAll(".tv"), function (x) { x.classList.toggle("hidden"); }); },
    done: function (el) {
      var n = +el.getAttribute("data-n"), k = state.lessonsDone.indexOf(n);
      if (k >= 0) state.lessonsDone.splice(k, 1); else { state.lessonsDone.push(n); toast("🎉 Mẹ đã học xong Bài " + n + "! Giỏi lắm!"); }
      save(); el.textContent = unitDone(n) ? "✓ Đã đánh dấu học xong (bấm để bỏ)" : "✓ Đánh dấu đã học xong bài này";
    },
    jump: function (el) { var t = document.getElementById(el.getAttribute("data-t")); if (t) t.scrollIntoView({ behavior: "smooth" }); },
    hints: function () { state.showHints = !state.showHints; save(); refreshKeepState(); },
    /* role-play */
    rpen: function () { RP.showEn = !RP.showEn; rpShow(false); },
    rpvi: function () { RP.showVi = !RP.showVi; rpShow(false); },
    rphelp: async function () {
      TTS.stop(); var my = SEQ;
      await TTS.speak("Sorry, could you say that again more slowly?", { rate: rateFor("slow") });
      if (my !== SEQ) return; await wait(500); if (my !== SEQ) return;
      RP.showEn = true; RP.showVi = true; rpShow(false);
      TTS.speak(RP.gText, { rate: 0.65, voice: RP.curVoice });
      toast("😊 Hỏi lại là rất bình thường! Khách đang nói chậm lại cho Mẹ.");
    },
    rpopt: function (el) {
      var k = +el.getAttribute("data-k"), o = RP.steps[RP.i].options[k];
      RP.fb = '<div class="bubble me"><div class="who">Mẹ Hằng:</div><div class="en">' + esc(o.en) + '</div><div class="vi">' + esc(o.vi) + "</div></div>" +
        '<div class="good">' + esc(pick(["Very good, Mẹ! Bây giờ Mẹ nói to câu này nhé.", "Great! They will understand you. Mẹ nói to câu này nhé!", "Câu trả lời rất hay! Mẹ nghe mẫu rồi nói theo nhé."])) + "</div>";
      rpShow(false);
      var fb = $("#rp-fb"); if (fb) { REG.push({ t: o.en, v: "" }); fb.insertAdjacentHTML("beforeend", '<div class="row"><button class="btn" data-act="play" data-r="' + (REG.length - 1) + '" data-mode="slow">🐢 Nghe mẫu lại</button></div>'); fb.scrollIntoView({ block: "center", behavior: "smooth" }); }
      TTS.stop(); TTS.speak(o.en, { rate: rateFor("slow") });
    },
    rpsr: function (el) {
      doSR("", el, function (r) {
        if (r.error) { RP.fb = '<div class="almost">' + esc(srErrorText(r.error)) + " Mẹ cũng có thể chọn một câu trả lời ở trên.</div>"; rpShow(false); return; }
        var best = null; RP.steps[RP.i].options.forEach(function (o) { var a = analyze(o.en, r.alts); if (!best || a.score > best.a.score) best = { a: a, o: o }; });
        RP.fb = feedbackHtml(best.a, best.o.en); rpShow(false);
      });
    },
    rprec: function () {
      var o = RP.steps[RP.i].options[0];
      RP.fb = '<div class="card"><p class="small">Mẹ bấm “Ghi âm”, nói câu trả lời, rồi bấm “Dừng”. Sau đó nghe lại giọng mình.</p><div class="row"><button class="btn" data-act="rec" data-id="rp">⏺️ Ghi âm</button></div><div id="rec-out"></div></div>';
      rpShow(false);
    },
    rpnext: function () { RP.i++; RP.fb = ""; RP.gText = null; RP.showVi = false; if (RP.i >= RP.steps.length) { state.roleplayCount++; markActivity(); } rpShow(true); window.scrollTo(0, 0); },
    rpagain: function () { var sim = RP.sim, n = RP.n, alt = RP.useAlt; startRP(n, { sim: sim, alt: sim ? true : alt }); RP.gText = null; rpShow(true); window.scrollTo(0, 0); },
    rpalt: function () { startRP(RP.n, { alt: true }); RP.gText = null; rpShow(true); window.scrollTo(0, 0); },
    /* listening quiz */
    lqplay: function (el) { TTS.stop(); el.classList.add("playing"); TTS.speak(lqText(), { rate: rateFor(el.getAttribute("data-mode")), voice: LQ.voice }).then(function () { el.classList.remove("playing"); }); },
    lqen: function () { LQ.showEn = true; lqShow(); },
    lqans: function (el) {
      if (LQ.answered) return; LQ.chosen = +el.getAttribute("data-k"); LQ.answered = true;
      state.listenCount++; markActivity();
      if (LQ.q.opts[LQ.chosen].id !== LQ.q.p.id) addToReview(LQ.q.p.id); else markPracticed(LQ.q.p.id);
      lqShow();
    },
    lqnext: function () { lqNew(); lqShow(); var b = $("#lq [data-act=lqplay]"); if (b) { TTS.stop(); TTS.speak(lqText(), { rate: rateFor("normal"), voice: LQ.voice }); } },
    lqmix: function (el) { LQ.mixVoices = !LQ.mixVoices; el.classList.toggle("on", LQ.mixVoices); el.classList.toggle("ghost", !LQ.mixVoices); el.textContent = "🎙️ " + (LQ.mixVoices ? "Đang đổi giọng ngẫu nhiên" : "Nghe nhiều giọng khác nhau"); LQ.voice = LQ.mixVoices ? TTS.random() : TTS.primary(); },
    /* unit review */
    urans: function (el) { if (UR.answered) return; UR.chosen = +el.getAttribute("data-k"); UR.answered = true; var q = UR.qs[UR.i]; if (q.opts[UR.chosen].id === q.p.id) { UR.right++; markPracticed(q.p.id); } else addToReview(q.p.id); urShow(); },
    urnext: function () { UR.i++; UR.answered = false; UR.chosen = null; if (UR.i >= UR.qs.length && !unitDone(UR.n)) { state.lessonsDone.push(UR.n); save(); } markActivity(); urShow(); window.scrollTo(0, 0); },
    uragain: function () { urNew(UR.n); urShow(); },
    /* review */
    rvkind: function (el) { pendingReviewKind = el.getAttribute("data-v"); refresh(); },
    rv: function (el) { var id = RV.ids[RV.i], easy = el.getAttribute("data-v") === "1"; reviewRate(id, easy); RV.done++; if (!easy && RV.again.indexOf(id) < 0 && RV.ids.length < 30) { RV.again.push(id); RV.ids.push(id); } RV.i++; rvShow(); window.scrollTo(0, 0); },
    /* speaking page */
    spnext: function () { var pool = SP.unit === "all" ? ALLP : unitByNum(+SP.unit).phrases; SP.id = pick(pool.filter(function (p) { return p.id !== SP.id; })).id; refresh(); },
    sppractice: function () { var l = practiceList(); SP.id = l[Math.floor(Math.random() * l.length)]; refresh(); },
    /* progress & settings */
    goal: function (el) { state.goal = Math.max(3, Math.min(30, state.goal + (+el.getAttribute("data-v")))); save(); refresh(); },
    voice: function (el) { var v = TTS.en[+el.getAttribute("data-i")]; if (!v) return; state.voiceURI = v.voiceURI; save(); $("#voices").innerHTML = voicesHtml(); TTS.speak("Hello! Welcome to Vietnam!", { voice: v, rate: state.speed }); },
    tryvoice: function (el) { var v = TTS.en[+el.getAttribute("data-i")]; if (v) { TTS.stop(); TTS.speak("Hello! Welcome to Vietnam!", { voice: v, rate: state.speed }); } },
    reset: function (el) {
      if (!resetArmed) { resetArmed = true; el.textContent = "Bấm lần nữa để xác nhận xóa"; el.classList.add("primary"); setTimeout(function () { resetArmed = false; if (el.isConnected) { el.textContent = "Xóa tiến độ"; el.classList.remove("primary"); } }, 6000); return; }
      Store.clear(); state = DEFAULTS(); save(); resetArmed = false; toast("Đã xóa tiến độ. Mình bắt đầu lại nhé!"); location.hash = "#/home";
    }
  };
  function refreshKeepState() {
    /* re-render pages that keep in-memory quiz state without resetting it */
    var h = location.hash;
    if (/listen\/(choose|what)/.test(h)) { var c = $("#lq"); var tmp = LQ.q, a = LQ.answered, ch = LQ.chosen, se = LQ.showEn, n = LQ.n; refresh(); LQ.q = tmp; LQ.answered = a; LQ.chosen = ch; LQ.showEn = se; LQ.n = n; lqShow(); return; }
    if (/roleplay|\/sim/.test(h)) { rpShow(false); Array.prototype.forEach.call(document.querySelectorAll("[data-act=speed]"), function (b) { var on = +b.getAttribute("data-v") === state.speed; b.classList.toggle("on", on); b.classList.toggle("ghost", !on); }); return; }
    if (/\/review$/.test(h) || /\/p\/\d+$/.test(h) || /\/speak$/.test(h)) { Array.prototype.forEach.call(document.querySelectorAll("[data-act=speed]"), function (b) { var on = +b.getAttribute("data-v") === state.speed; b.classList.toggle("on", on); b.classList.toggle("ghost", !on); }); if (!/\/p\/\d+$|\/speak$/.test(h)) return; }
    refresh();
  }

  document.addEventListener("click", function (e) {
    var a = e.target.closest ? e.target.closest("a[data-scroll]") : null;
    if (a) pendingScroll = (a.getAttribute("data-scroll") === "mic") ? "g-mic" : a.getAttribute("data-scroll");
    var ra = e.target.closest ? e.target.closest("a[data-review]") : null;
    if (ra) pendingReviewKind = ra.getAttribute("data-review");
    var el = e.target.closest ? e.target.closest("[data-act]") : null;
    if (!el || el.disabled) return;
    var f = ACT[el.getAttribute("data-act")];
    if (f) { e.preventDefault(); try { f(el); } catch (err) { if (window.console) console.error(err); toast("Có lỗi nhỏ. Mẹ thử bấm lại nhé."); } }
  });
  document.addEventListener("change", function (e) {
    var el = e.target; if (!el || !el.getAttribute) return;
    var k = el.getAttribute("data-change");
    if (k === "lqunit") { LQ.unit = el.value; LQ.n = 0; lqNew(); lqShow(); }
    if (k === "spunit") { SP.unit = el.value; var pool = SP.unit === "all" ? ALLP : unitByNum(+SP.unit).phrases; SP.id = pool[0].id; refresh(); }
  });
  document.addEventListener("mh-voices", function () {
    var v = $("#voices"); if (v) v.innerHTML = voicesHtml();
    if (RP) RP.curVoice = voiceOf(RP.voice);
    if (LQ.q && !LQ.voice) LQ.voice = LQ.mode === "what" ? (TTS.secondary() || TTS.primary()) : TTS.primary();
  });
  window.addEventListener("hashchange", function () { render(false); });

  /* home-screen icon drawn at runtime (no external files) */
  function makeIcon() {
    try {
      var c = document.createElement("canvas"); c.width = c.height = 180; var g = c.getContext("2d");
      g.fillStyle = "#7A3B24"; g.fillRect(0, 0, 180, 180);
      var gr = g.createRadialGradient(90, 80, 10, 90, 92, 70); gr.addColorStop(0, "#FFD36B"); gr.addColorStop(1, "#D9562E");
      g.fillStyle = gr; g.beginPath(); g.ellipse(90, 92, 52, 62, 0, 0, Math.PI * 2); g.fill();
      g.fillStyle = "#F3C75F"; g.fillRect(70, 26, 40, 10); g.fillRect(70, 148, 40, 10); g.fillRect(86, 158, 8, 16);
      g.fillStyle = "#7A3B24"; g.font = "bold 40px -apple-system, Arial, sans-serif"; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText("Mẹ", 90, 94);
      var l = document.querySelector("link[rel=apple-touch-icon]"); if (l) l.href = c.toDataURL("image/png");
      var f = document.querySelector("link[rel=icon]"); if (f) f.href = c.toDataURL("image/png");
    } catch (e) {}
  }

  /* ---------- boot ---------- */
  loadState(); if (!Store.ok) showStorageBanner();
  TTS.init(); makeIcon(); render(false);

  /* test hooks (read-only helpers used by the automated QA script) */
  window.__MH = { LESSONS: LESSONS, QUICK: QUICK, analyze: analyze, daysUntilArrival: daysUntilArrival, hcmToday: hcmToday, streak: streak, state: function () { return state; }, Store: Store, SR: !!SRClass, REC: REC_OK, TTS: TTS, currentWeek: currentWeek };
})();
